<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="finBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F6FE"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF5FF"/>
    </linearGradient>
    <linearGradient id="barBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="barGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="goldCoinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007AFF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#007AFF" flood-opacity="0.18"/>
    </filter>
    <filter id="coinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D97706" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#finBgGrad)"/>

  <g id="ambientGlow">
    <circle cx="220" cy="180" r="140" fill="#007AFF" opacity="0.06"/>
    <circle cx="460" cy="220" r="130" fill="#10B981" opacity="0.06"/>
  </g>

  <!-- Linha de Base e Grade -->
  <line x1="230" y1="290" x2="470" y2="290" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
  <line x1="230" y1="220" x2="470" y2="220" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="230" y1="150" x2="470" y2="150" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Barras Financeiras -->
  <g id="financialBars" filter="url(#glowShadow)">
    <rect x="266" y="210" width="32" height="80" rx="6" fill="url(#barBlueGrad)"/>
    <rect x="310" y="170" width="32" height="120" rx="6" fill="url(#barBlueGrad)"/>
    <rect x="354" y="135" width="32" height="155" rx="6" fill="url(#barGreenGrad)"/>
    <rect x="398" y="185" width="32" height="105" rx="6" fill="url(#barBlueGrad)"/>
  </g>

  <!-- Moedas Douradas Flutuantes -->
  <g id="floatingCoins" filter="url(#coinShadow)">
    <!-- Moeda 1 -->
    <g transform="translate(225, 170)">
      <circle cx="0" cy="0" r="15" fill="url(#goldCoinGrad)"/>
      <circle cx="0" cy="0" r="12" fill="none" stroke="#FDE68A" stroke-width="1.5" opacity="0.8"/>
      <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="bold" fill="#FFF" font-family="-apple-system, sans-serif">$</text>
    </g>
    <!-- Moeda 2 -->
    <g transform="translate(455, 140)">
      <circle cx="0" cy="0" r="13" fill="url(#goldCoinGrad)"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#FDE68A" stroke-width="1.5" opacity="0.8"/>
      <text x="0" y="4" text-anchor="middle" font-size="10" font-weight="bold" fill="#FFF" font-family="-apple-system, sans-serif">$</text>
    </g>
    <!-- Moeda 3 -->
    <g transform="translate(465, 245)">
      <circle cx="0" cy="0" r="11" fill="url(#goldCoinGrad)"/>
      <circle cx="0" cy="0" r="8.5" fill="none" stroke="#FDE68A" stroke-width="1.2" opacity="0.8"/>
      <text x="0" y="3.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#FFF" font-family="-apple-system, sans-serif">$</text>
    </g>
  </g>

  <!-- Lupa de Analise Financeira (AI Inspector) -->
  <g id="magnifierGlass" filter="url(#glowShadow)">
    <!-- Lente de vidro -->
    <circle cx="395" cy="175" r="48" fill="url(#lensGrad)"/>
    <circle cx="395" cy="175" r="48" fill="none" stroke="#007AFF" stroke-width="7"/>
    <circle cx="395" cy="175" r="44" fill="none" stroke="#60A5FA" stroke-width="1.5" opacity="0.7"/>
    <!-- Reflexo do vidro da lente -->
    <path d="M 365 150 A 40 40 0 0 1 425 150" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <!-- Cabo ergonomico da lupa -->
    <line x1="432" y1="212" x2="472" y2="252" stroke="#0F172A" stroke-width="10" stroke-linecap="round"/>
    <line x1="435" y1="215" x2="469" y2="249" stroke="#007AFF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Textos de Identidade Visual FinLink AI -->
  <text x="340" y="372" text-anchor="middle" font-size="28" font-weight="800" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="-0.5">FinLink AI</text>
  <text x="340" y="402" text-anchor="middle" font-size="14" font-weight="500" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Gestão Financeira Inteligente · NFC-e · Open Finance</text>
</svg>